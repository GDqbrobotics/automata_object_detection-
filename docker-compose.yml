services:
  mqtt:
    image: eclipse-mosquitto:latest
    ports:
      - 1883:1883
      - 9001:9001
      - 8080:8080
    volumes:
      - ./mqtt/mosquitto-config:/mosquitto/config/
      - ./mqtt/auth:/auth 
  automata-cv:
    build:
      context: .
      dockerfile: Dockerfile
    privileged: true
    network_mode: host
    volumes:
      - .:/home/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev:/dev
    device_cgroup_rules:
      - 'c 81:* rmw'
      - 'c 189:* rmw'
    environment:
      - DISPLAY=$DISPLAY  # needed to show results on screen
      - XAUTHORITY=$XAUTHORITY  # needed to show results on screen
    command: bash -c "pip install --no-deps -e /home/workspace && pip install -r /home/workspace/requirements.txt && python3 /home/workspace/object_extraction.py --mqtt-host 127.0.0.1"
